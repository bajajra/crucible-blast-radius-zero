# CRUCIBLE_DSH_SMOKE_DENY_ALL=1 makes the hook deny it before shell dispatch.
- id: llm-pi-ai
  disabled: true

- id: agent-default-model
  config:
    provider: cli-mock
    model: cli-mock

- insert:
    - id: cli-mock-llm
      name: '../../deepseek-harness/packages/test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'
